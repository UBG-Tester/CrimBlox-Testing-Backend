name: Keep Supabase project active

on:
  schedule:
    # Every 4 days; GitHub may delay scheduled jobs during high load.
    - cron: "17 3 */4 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the Supabase database marker
        env:
          SUPABASE_URL: https://wsvyyussvzqolozstatl.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_LFnNpZ0Y9ZLjftvo8d9EAw_g26ztm3o
        run: |
          set -euo pipefail
          url="${SUPABASE_URL%/}/rest/v1/crimblox_keepalive?select=id&limit=1"
          status="$(curl --silent --show-error --output /tmp/supabase-response.json --write-out '%{http_code}' \
            --max-time 20 \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Accept: application/json" \
            "$url")"
          cat /tmp/supabase-response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase database keepalive failed with HTTP $status"
            exit 1
          fi
          echo "Supabase database keepalive succeeded (HTTP $status)."
