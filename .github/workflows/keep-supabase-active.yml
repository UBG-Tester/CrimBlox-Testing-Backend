name: Keep Supabase project active

on:
  schedule:
    # Every 4 days; GitHub may delay scheduled jobs during high load.
    - cron: "17 3 */4 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY under GitHub repository Actions secrets."
            exit 1
          fi
          url="${SUPABASE_URL%/}/rest/v1/forum_categories?select=id&limit=1"
          status="$(curl --silent --show-error --output /tmp/supabase-response.json --write-out '%{http_code}' \
            --max-time 20 \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Accept: application/json" \
            "$url")"
          cat /tmp/supabase-response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase REST ping failed with HTTP $status"
            exit 1
          fi
          echo "Supabase REST ping succeeded (HTTP $status)."
